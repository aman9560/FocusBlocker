<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked · Focus</title>
  <style>
    :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --accent: #2f7d32; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe7; --muted: #9a9993; --accent: #7cc47f; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
           display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    main { max-width: 34rem; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { color: var(--muted); margin: .25rem 0; overflow-wrap: anywhere; }
    #remaining { color: var(--accent); font-size: 2.5rem; font-variant-numeric: tabular-nums; margin: 1.25rem 0; }
    button { font: inherit; padding: .5rem 1.25rem; border-radius: 999px; border: 1px solid var(--muted); background: transparent;
             color: var(--fg); cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">This site is blocked</h1>
    <p id="detail"></p>
    <div id="remaining"></div>
    <p id="note">Sessions can only be ended from the Focus app on this Mac.</p>
    <button id="back" type="button">Go back</button>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
