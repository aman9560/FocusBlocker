name: Release

# Builds and publishes everything on a version tag: the macOS app (ZIP and DMG), the Windows app (ZIP and EXE) and
# the Chrome extension ZIP. Run it from the Actions tab to rebuild a release, or push a tag such as v0.2.3.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish
        required: true
        default: v0.2.3

permissions:
  contents: write

env:
  # Not named VERSION: MSBuild reads environment variables as properties, so a VERSION variable becomes the
  # projects' Version, 'v0.2.3' isn't a valid package version, and every dotnet restore fails (MSB4181).
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: ./build.sh test
      - name: Build the app
        run: FOCUS_VERSION="${RELEASE_TAG#v}" ./build.sh app
      - name: Package ZIP, DMG and extension
        run: |
          set -euo pipefail
          mkdir -p out stage
          ditto -c -k --keepParent .build/FocusBlocker.app out/FocusBlocker-macOS-arm64.zip
          ditto .build/FocusBlocker.app stage/FocusBlocker.app
          ln -s /Applications stage/Applications
          cat > "stage/READ ME FIRST.txt" <<'TXT'
          Drag FocusBlocker to Applications.

          If macOS says it can't check the app for malicious software, that is because FocusBlocker is signed
          ad hoc rather than with a paid Apple Developer ID. The easiest way to avoid the warning entirely is to
          install from Terminal instead, which doesn't get the browser-download flag:

            curl -fsSL https://raw.githubusercontent.com/aman9560/FocusBlocker/main/install-mac.sh | bash

          Or, after dragging it to Applications, run once:

            xattr -dr com.apple.quarantine /Applications/FocusBlocker.app
          TXT
          hdiutil create -volname "FocusBlocker" -srcfolder stage -ov -format UDZO out/FocusBlocker-macOS-arm64.dmg
          mkdir -p ext/FocusBlocker-Chrome-Extension
          cp Extension/* ext/FocusBlocker-Chrome-Extension/
          cp Assets/CHROME-EXTENSION-INSTALL.md ext/FocusBlocker-Chrome-Extension/README.txt
          (cd ext && ditto -c -k --keepParent FocusBlocker-Chrome-Extension ../out/FocusBlocker-Chrome-Extension.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore projects
        shell: pwsh
        run: |
          # NuGet occasionally fails with a transient error (MSB4181), so retry rather than fail the release.
          # The app and host are restored for win-x64 because they are published for that runtime with --no-restore;
          # a restore without it leaves publish with no win-x64 target (NETSDK1047).
          function Restore([string[]]$Arguments) {
            foreach ($attempt in 1..3) {
              dotnet restore @Arguments --ignore-failed-sources
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "restore failed (attempt $attempt of 3)"
              Start-Sleep -Seconds (5 * $attempt)
            }
            throw "dotnet restore failed: $Arguments"
          }
          Restore @('Windows/FocusBlocker.Tests/FocusBlocker.Tests.csproj')
          Restore @('Windows/FocusBlocker.App/FocusBlocker.App.csproj', '-r', 'win-x64')
          Restore @('Windows/FocusBlocker.NativeHost/FocusBlocker.NativeHost.csproj', '-r', 'win-x64')
      - name: Test
        run: dotnet run --project Windows/FocusBlocker.Tests -c Release --no-restore
      - name: Publish and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'FocusBlocker-Windows'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          dotnet publish Windows/FocusBlocker.App/FocusBlocker.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o $dist
          dotnet publish Windows/FocusBlocker.NativeHost/FocusBlocker.NativeHost.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -o (Join-Path $dist 'host')
          Copy-Item Extension (Join-Path $dist 'extension') -Recurse
          Copy-Item Windows/README.md (Join-Path $dist 'README-Windows.md')
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath out/FocusBlocker-Windows-x64.zip -Force
          Copy-Item (Join-Path $dist 'FocusBlocker.App.exe') out/FocusBlocker.App.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la assets
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "FocusBlocker $RELEASE_TAG" --target main --latest \
              --notes "FocusBlocker $RELEASE_TAG for macOS (Apple silicon) and Windows (x64), with the Chrome extension. Install on a Mac with install-mac.sh and on Windows with install-windows.ps1 (see the README); this avoids the unsigned-app warnings. The Chrome extension is a separate install."
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
