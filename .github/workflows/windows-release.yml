name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'FocusBlocker-Windows'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          dotnet publish Windows/FocusBlocker.App/FocusBlocker.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o $dist
          dotnet publish Windows/FocusBlocker.NativeHost/FocusBlocker.NativeHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o (Join-Path $dist 'host')
          Copy-Item Extension (Join-Path $dist 'extension') -Recurse
          Copy-Item Windows/README.md (Join-Path $dist 'README-Windows.md')
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'FocusBlocker-Windows-x64.zip') -Force
      - name: Add Windows assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $releaseUri = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$env:VERSION"
          $previous = $null
          try {
            $previous = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/latest" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          $body = @{ tag_name = $env:VERSION; target_commitish = 'main'; name = "FocusBlocker $env:VERSION"; body = 'Full Windows x64 release with timed and scheduled sessions, named blocklists, accountability locks, import, activity history, background enforcement, and Chrome integration. Download the ZIP for the complete Windows app, native host, extension files and setup notes. The standalone EXE does not include Chrome integration files. macOS builds and the standalone extension are also attached when available.'; draft = $false; prerelease = $false; make_latest = 'true' } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $body
          }
          $copiedAssets = @()
          foreach ($name in @('FocusBlocker-macOS-arm64.dmg', 'FocusBlocker-macOS-arm64.zip', 'FocusBlocker-Chrome-Extension.zip')) {
            $sourceAsset = if ($null -eq $previous) { $null } else { $previous.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1 }
            if ($null -eq $sourceAsset) { Write-Host "No previous release asset found for $name"; continue }
            $path = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri $sourceAsset.browser_download_url -OutFile $path
            $type = if ($name.EndsWith('.dmg')) { 'application/x-apple-diskimage' } elseif ($name.EndsWith('.zip')) { 'application/zip' } else { 'application/octet-stream' }
            $copiedAssets += @{ Name = $name; Path = $path; ContentType = $type }
          }
          $assets = @()
          $assets += $copiedAssets
          $assets += @{ Name = 'FocusBlocker-Windows-x64.zip'; Path = (Join-Path $env:RUNNER_TEMP 'FocusBlocker-Windows-x64.zip'); ContentType = 'application/zip' }
          $assets += @{ Name = 'FocusBlocker.App.exe'; Path = (Join-Path (Join-Path $env:RUNNER_TEMP 'FocusBlocker-Windows') 'FocusBlocker.App.exe'); ContentType = 'application/vnd.microsoft.portable-executable' }
          foreach ($item in $assets) {
            if ($release.assets.name -contains $item.Name) {
              Write-Host "Skipping existing release asset $($item.Name)"
              continue
            }
            $upload = "https://uploads.github.com/repos/$env:REPOSITORY/releases/$($release.id)/assets?name=$($item.Name)"
            Invoke-RestMethod -Method Post -Uri $upload -Headers $headers -ContentType $item.ContentType -InFile $item.Path | Out-Null
          }
